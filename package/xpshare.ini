; Shared XP for Enshrouded dedicated servers.
; Shares non-combat XP (exploration, books, quests, mining, item sets) with every
; other player who is online, at any distance. Combat XP is left to the game.
; Changes take effect after a server restart.
[xpshare]
Enabled=1
; Shared XP = the other player's gain x Multiplier (1.0 = the same amount, 0 to 10).
Multiplier=1.0
Log=1
; 1 = one log line per gain and per share (to check that it works), 0 = start-up and errors only.
LogEveryShare=0
; Test only: 1 = your own non-combat XP is credited to you once more (solo check).
TestSelfShare=0
; Diagnostics: 1 = log every XP amount a player receives, from any source.
LogAllXp=0
